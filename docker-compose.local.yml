services:
  rag-chat-storage-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chat-storage-service
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      logstash:
        condition: service_started
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
