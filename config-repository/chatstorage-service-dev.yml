server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ragchatstoredev}
    username: ${SPRING_DATASOURCE_USERNAME:ragchat_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:DevPa55word!}
    driver: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  rate:
    limit:
      requests: ${RATE_LIMIT_REQUESTS:200}
      windowSeconds: ${RATE_LIMIT_TIME_WINDOW:300}
  api:
    key: ${API_KEY:dev-ragchat-api-key}
  cache:
    ttl: ${CACHE_TTL:10}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev.ragchat.example.com}
  encryption:
    key: ${ENCRYPTION_KEY:change-me-dev-base64-key}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:8761/eureka}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

elasticsearch:
  url: ${ELASTICSEARCH_URL:http://elasticsearch:9200}
logstash:
  host: ${LOGSTASH_HOST:logstash}
  port: ${LOGSTASH_PORT:5001}
kibana:
  url: ${KIBANA_URL:http://kibana:5601}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  service:
    name: ${OTEL_SERVICE_NAME:chatstorage-service-dev}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
