server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}


app:
  rate:
    limit:
      requests: ${RATE_LIMIT_REQUESTS:10}
      windowSeconds: ${RATE_LIMIT_TIME_WINDOW:300}
  api:
    key: ${API_KEY}
  cache:
    ttl: ${CACHE_TTL:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:8761/eureka}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30


elasticsearch:
  url: ${ELASTICSEARCH_URL:http://elasticsearch:9200}
logstash:
  host: ${LOGSTASH_HOST:logstash}
  port: ${LOGSTASH_PORT:5001}
kibana:
  url: ${KIBANA_URL:http://kibana:5601}


otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
  service:
    name: ${OTEL_SERVICE_NAME:chatstorage-service-local}


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
